name: Lint

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  lint:
    name: Code and Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
