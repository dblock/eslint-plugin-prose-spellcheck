name: Package

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.entry.node }} with ESLint ${{ matrix.entry.eslint }} on ${{ matrix.entry.os }}
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { node: '22.18.0', eslint: '10.0.0', js: '10.0.1', os: macos-latest }
          - { node: '26.13.0', eslint: '9.39.5', js: '9.39.5', os: windows-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.entry.node }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Select ESLint Compatibility Pair
        run: npm install --no-save --package-lock=false --strict-peer-deps eslint@${{ matrix.entry.eslint }} @eslint/js@${{ matrix.entry.js }}
      - name: Validate Package and Consumer
        run: npm run test:package
