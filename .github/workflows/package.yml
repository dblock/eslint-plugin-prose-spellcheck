name: Package

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.entry.node }} on ${{ matrix.entry.os }}
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { node: '22.18.0', os: ubuntu-latest }
          - { node: '26.13.0', os: ubuntu-latest }
          - { node: '26.13.0', os: macos-latest }
          - { node: '26.13.0', os: windows-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.entry.node }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Validate Package and Consumer
        run: npm run test:package
