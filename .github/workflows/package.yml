name: Package

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.entry.node }} with ESLint ${{ matrix.entry.eslint }} and Markdown ${{ matrix.entry.markdown }} on ${{ matrix.entry.os }}
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { node: '22.18.0', eslint: '10.0.0', js: '10.0.1', markdown: '8.0.3', os: macos-latest }
          - { node: '26.13.0', eslint: '9.39.5', js: '9.39.5', markdown: '9.0.0', os: windows-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.entry.node }}
          cache: npm
      - name: Install Dependencies
        run: npm ci ${{ matrix.entry.node == '22.18.0' && '--engine-strict=false' || '' }}
      - name: Select ESLint and Markdown Versions
        run: npm install --no-save --package-lock=false --strict-peer-deps ${{ matrix.entry.node == '22.18.0' && '--engine-strict=false' || '' }} eslint@${{ matrix.entry.eslint }} @eslint/js@${{ matrix.entry.js }} @eslint/markdown@${{ matrix.entry.markdown }}
      - name: Validate Package and Consumer
        run: npm run test:package
