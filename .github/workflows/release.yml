name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional numeric release version overriding package.json.
        type: string
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: dblock/npm-package-release/.github/workflows/release.yml@v0.2.0
    with:
      version: ${{ inputs.version }}
      node-version: '26.13.0'
      npm-version: '12.2.2'
